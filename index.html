<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Bull Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font:14px system-ui,Arial}.top{background:#fff;border-bottom:1px solid #e2e7f0;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}.brand{font-size:18px;font-weight:850}.brand span{color:#3867f5}.wrap{max-width:980px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}.head h1{font-size:23px;margin:0 0 4px}.muted{color:#718096;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.blue{background:#3867f5;color:#fff}.light{background:#edf1fb;color:#24324c}.red{background:#fff0f0;color:#d63d4c}.small{padding:7px 9px;font-size:12px}.bar{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid #e1e6f0;border-radius:15px;padding:14px;margin-bottom:12px}.row{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.emoji{height:43px;width:43px;border-radius:12px;background:#eef2ff;display:grid;place-items:center;font-size:21px;flex-shrink:0}.title{font-weight:800}.sub{font-size:12px;color:#738097;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid .card{margin:0}.clickcard{cursor:pointer}.clickcard:active{transform:scale(.99)}.line{height:1px;background:#edf0f6;margin:12px 0}.crumb{font-size:12px;color:#748098;margin-bottom:12px}.crumb button{background:none;padding:0;color:#3867f5}.pill{display:inline-block;background:#eef3ff;color:#3867f5;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:800;margin-top:5px}.empty{padding:28px;text-align:center;color:#7a8599}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px;color:#4c5870}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ed;border-radius:9px;padding:11px;background:#fff;font:inherit}.field textarea{min-height:80px}.overlay{position:fixed;inset:0;background:#10182c99;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}.modal{background:#fff;border-radius:17px;width:min(500px,100%);padding:18px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{font-size:18px;margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{font-size:12px;background:#fff8e7;color:#8b6517;border-radius:10px;padding:11px;margin-bottom:13px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:12px 16px;border-radius:10px;display:none;z-index:20}
@media(max-width:560px){.wrap{padding:13px}.head h1{font-size:20px}.grid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.top{padding:12px}.head .btn{padding:9px}.card{padding:12px}.actions{justify-content:flex-end}}
</style></head><body>
<header class="top"><div class="brand">🐂 Study <span>Bull</span> <span style="color:#8792a6;font-size:11px;font-weight:600">ADMIN</span></div><div class="muted">Demo Panel</div></header>
<main class="wrap"><div id="app"></div></main>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><h2 id="mtitle">Create</h2><button class="btn light small" onclick="closeModal()">✕</button></div><div id="mbody"></div><div class="modalfoot"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn blue" id="msave">Save</button></div></div></div><div class="toast" id="toast"></div>
<script>
const defaults=[
{id:1,name:'Quiz',icon:'🧠',kind:'button',parent:null,children:[],contents:[]},
{id:2,name:'Mock Test',icon:'📝',kind:'button',parent:null,children:[],contents:[]},
{id:3,name:'All Subjects',icon:'📚',kind:'button',parent:null,children:[],contents:[]},
{id:4,name:'Notes',icon:'📖',kind:'button',parent:null,children:[],contents:[]}
];
let nodes=JSON.parse(localStorage.getItem('sb-simple-nodes')||'null')||defaults;
let current=null; // null means home
let modalMode='', editId=null;
const $=x=>document.getElementById(x), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('sb-simple-nodes',JSON.stringify(nodes))}
function get(id){return nodes.find(n=>n.id===Number(id))}
function kids(id){return nodes.filter(n=>n.parent===Number(id)&&n.kind!=='content')}
function contents(id){return nodes.filter(n=>n.parent===Number(id)&&n.kind==='content')}
function countAll(id){return kids(id).length}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function go(id){current=id;render()}
function crumb(){let arr=[],n=get(current);while(n){arr.unshift(n);n=n.parent?get(n.parent):null}return `<div class="crumb"><button onclick="go(null)">Home</button>${arr.map(n=>' / '+esc(n.name)).join('')}</div>`}
function nodeCard(n){let childCount=kids(n.id).length, cCount=contents(n.id).length;return `<div class="card"><div class="row"><div class="emoji">${esc(n.icon||'📁')}</div><div class="grow clickcard" onclick="go(${n.id})"><div class="title">${esc(n.name)} <span style="color:#3867f5">›</span></div><div class="sub">${childCount} folders/sections · ${cCount} content items</div><span class="pill">${esc(n.kind==='button'?'HOME BUTTON':'FOLDER / SECTION')}</span></div></div><div class="line"></div><div class="actions"><button class="btn light small" onclick="go(${n.id})">Open / View</button><button class="btn light small" onclick="editNode(${n.id})">Edit</button><button class="btn red small" onclick="delNode(${n.id})">Delete</button></div></div>`}
function contentCard(n){return `<div class="card"><div class="row"><div class="emoji">${esc(n.icon||'📄')}</div><div class="grow"><div class="title">${esc(n.name)}</div><div class="sub">${esc(n.contentType||'Content')}${n.detail?' · '+esc(n.detail):''}</div></div></div><div class="line"></div><div class="actions"><button class="btn light small" onclick="editContent(${n.id})">Edit</button><button class="btn red small" onclick="delNode(${n.id})">Delete</button></div></div>`}
function render(){let n=get(current);let topNodes=nodes.filter(x=>x.parent===null&&x.kind!=='content');let areaNodes=n?kids(n.id):topNodes;let areaContents=n?contents(n.id):[];$('app').innerHTML=`
${n?crumb():''}
<div class="head"><div><h1>${n?esc(n.name):'Home Page Buttons'}</h1><div class="muted">${n?'Iske andar ke folders, sections aur content yahan manage karo.':'Saare existing buttons yahan hain. Button tap karke uske andar ka data dekho.'}</div></div><div class="bar"><button class="btn light" onclick="openCreate()">Create</button><button class="btn blue" onclick="openAddContent()">＋</button></div></div>
<div class="notice"><b>Create</b> = button / folder / section / partition banana. &nbsp; <b>＋</b> = Quiz, Mock Test, Notes ya doosra content add karna.</div>
${n?`<div class="card"><div class="row"><div class="emoji">${esc(n.icon||'📁')}</div><div class="grow"><div class="title">Current container</div><div class="sub">${esc(n.name)} · ${kids(n.id).length} folders/sections · ${contents(n.id).length} content items</div></div><div class="actions"><button class="btn light small" onclick="editNode(${n.id})">Edit</button><button class="btn red small" onclick="delNode(${n.id})">Delete</button></div></div></div>`:''}
<h3 style="font-size:15px;margin:18px 0 10px">${n?'Folders & Sections':'Existing Buttons'} <span class="muted">(${areaNodes.length})</span></h3>
${areaNodes.length?`<div class="grid">${areaNodes.map(nodeCard).join('')}</div>`:'<div class="card empty">Abhi koi folder/section nahi hai. <br> <b>Create</b> dabakar banao.</div>'}
<h3 style="font-size:15px;margin:20px 0 10px">Content <span class="muted">(${areaContents.length})</span></h3>
${areaContents.length?`<div class="grid">${areaContents.map(contentCard).join('')}</div>`:'<div class="card empty">Abhi koi Quiz, Mock Test, Notes ya content nahi hai. <br> <b>＋</b> dabakar add karo.</div>'}
<div class="muted" style="margin:18px 2px">Demo only: changes is browser mein save hote hain. Firebase/user app se abhi connected nahi hai.</div>`}
function openCreate(){modalMode='node';editId=null;$('mtitle').textContent='Create Button / Folder / Section';$('mbody').innerHTML=`
<div class="field"><label>Name</label><input id="nName" placeholder="e.g. Physics, Chapter 1, Practice"></div>
<div class="formrow"><div class="field"><label>Icon / Emoji</label><input id="nIcon" value="📁"></div><div class="field"><label>Layout type</label><select id="nKind"><option value="folder">Folder / Section</option><option value="button">Home Button</option></select></div></div>
<div class="field"><label>Place inside</label><select id="nParent"><option value="${current||''}">${current?esc(get(current).name):'Home Page (top level)'}</option>${nodes.filter(x=>x.kind!=='content'&&x.id!==current).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
<div class="field"><label>Layout position</label><select id="nLayout"><option>Normal card</option><option>Wide section</option><option>Compact button</option><option>Full-width partition</option></select></div>
<div class="muted">Isse container banega. Iske andar phir folders/sections aur content add kar sakte ho.</div>`;$('msave').onclick=saveNode;$('overlay').style.display='flex'}
function editNode(id){let n=get(id);modalMode='node';editId=id;$('mtitle').textContent='Edit '+n.name;$('mbody').innerHTML=`<div class="field"><label>Name</label><input id="nName" value="${esc(n.name)}"></div><div class="formrow"><div class="field"><label>Icon</label><input id="nIcon" value="${esc(n.icon)}"></div><div class="field"><label>Type</label><select id="nKind"><option value="button" ${n.kind==='button'?'selected':''}>Home Button</option><option value="folder" ${n.kind!=='button'?'selected':''}>Folder / Section</option></select></div></div><div class="field"><label>Move inside</label><select id="nParent"><option value="">Home Page (top level)</option>${nodes.filter(x=>x.kind!=='content'&&x.id!==id&&!isDescendant(x.id,id)).map(x=>`<option value="${x.id}" ${String(n.parent)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Layout</label><select id="nLayout"><option>${esc(n.layout||'Normal card')}</option><option>Wide section</option><option>Compact button</option><option>Full-width partition</option></select></div>`;$('msave').onclick=saveNode;$('overlay').style.display='flex'}
function isDescendant(possible,id){let n=get(possible);while(n&&n.parent){if(n.parent===id)return true;n=get(n.parent)}return false}
function saveNode(){let name=$('nName').value.trim();if(!name){toast('Name likho');return}let parent=$('nParent').value===''?null:Number($('nParent').value);if(editId&&parent===editId){toast('Khud ke andar move nahi kar sakte');return}let obj={name,icon:$('nIcon').value.trim()||'📁',kind:$('nKind').value,parent,layout:$('nLayout').value};if(editId){Object.assign(get(editId),obj)}else{obj.id=Date.now();obj.children=[];obj.contents=[];nodes.push(obj)}persist();$('overlay').style.display='none';render();toast(editId?'Changes saved':'Container created')}
function openAddContent(){if(current===null){/* add content directly at home is allowed */}modalMode='content';editId=null;$('mtitle').textContent='＋ Add Content / Data';$('mbody').innerHTML=`<div class="field"><label>Content title</label><input id="cName" placeholder="e.g. Class 10 Science Quiz"></div><div class="formrow"><div class="field"><label>Content type</label><select id="cType"><option>Quiz</option><option>Mock Test</option><option>Notes</option><option>MCQ Set</option><option>Topic</option><option>PDF / File</option><option>Link</option><option>Custom Content</option></select></div><div class="field"><label>Icon</label><input id="cIcon" value="📄"></div></div><div class="field"><label>Short description / content</label><textarea id="cDetail" placeholder="Description, notes, link ya content ka short text"></textarea></div><div class="field"><label>Add inside</label><select id="cParent"><option value="${current||''}">${current?esc(get(current).name):'Home Page'}</option>${nodes.filter(x=>x.kind!=='content'&&x.id!==current).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="muted">Yeh content item hai, folder/container nahi. Uske liye Create button use karo.</div>`;$('msave').onclick=saveContent;$('overlay').style.display='flex'}
function saveContent(){let name=$('cName').value.trim();if(!name){toast('Content ka title likho');return}let parent=$('cParent').value===''?null:Number($('cParent').value);let obj={id:editId||Date.now(),name,icon:$('cIcon').value.trim()||'📄',kind:'content',contentType:$('cType').value,detail:$('cDetail').value.trim(),parent};if(editId)Object.assign(get(editId),obj);else nodes.push(obj);persist();$('overlay').style.display='none';render();toast(editId?'Content updated':'Content added')}
function editContent(id){let n=get(id);modalMode='content';editId=id;$('mtitle').textContent='Edit Content';$('mbody').innerHTML=`<div class="field"><label>Content title</label><input id="cName" value="${esc(n.name)}"></div><div class="formrow"><div class="field"><label>Content type</label><select id="cType">${['Quiz','Mock Test','Notes','MCQ Set','Topic','PDF / File','Link','Custom Content'].map(t=>`<option ${t===n.contentType?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Icon</label><input id="cIcon" value="${esc(n.icon)}"></div></div><div class="field"><label>Description / content</label><textarea id="cDetail">${esc(n.detail||'')}</textarea></div><div class="field"><label>Move inside</label><select id="cParent"><option value="">Home Page</option>${nodes.filter(x=>x.kind!=='content').map(x=>`<option value="${x.id}" ${String(n.parent)===String(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;$('msave').onclick=saveContent;$('overlay').style.display='flex'}
function delNode(id){let n=get(id);if(!confirm(`"${n.name}" delete karna hai? Iske andar ka nested data bhi delete hoga.`))return;let remove=new Set([Number(id)]);let changed=true;while(changed){changed=false;nodes.forEach(x=>{if(remove.has(x.parent)&&!remove.has(x.id)){remove.add(x.id);changed=true}})}nodes=nodes.filter(x=>!remove.has(x.id));if(current&&remove.has(current))current=null;persist();render();toast('Item deleted')}
function closeModal(){$('overlay').style.display='none'}
render();
</script></body></html>
